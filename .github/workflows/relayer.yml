name: Relayer

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: relayer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol and state tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # anvil and forge for the mandatory local-EVM Cronos submitter tests.
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.5
          cache: false
      - name: Verify every action and image is pinned
        run: bash scripts/verify-actions-pinned.sh
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run vectors
      # Dependency audit failure policy: retry the production audit up to three
      # times and preserve the final nonzero exit status. An unavailable
      # registry cannot establish that unchanged dependencies are still safe
      # (advisories appear without lockfile changes), so there is no success
      # fallback when the registry fails.
      - name: Audit production dependencies
        shell: bash
        run: |
          audit_output=""
          for attempt in 1 2 3; do
            set +e
            audit_output="$(npm audit --omit=dev --audit-level=high \
              --fetch-timeout=60000 \
              --fetch-retries=2 \
              --fetch-retry-mintimeout=1000 \
              --fetch-retry-maxtimeout=10000 2>&1)"
            audit_status=$?
            set -e
            printf '%s\n' "$audit_output"
            if [ "$audit_status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          exit "$audit_status"

  chain-fixtures:
    name: Chain fixtures against the pinned pos-chain commit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # The single pin: test/fixtures/xitcoin-chain-vectors.json "posChainCommit".
      - name: Read the pinned pos-chain commit
        id: pin
        shell: bash
        run: |
          commit="$(sed -n 's/^  "posChainCommit": "\([0-9a-f]\{40\}\)",$/\1/p' test/fixtures/xitcoin-chain-vectors.json)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: xitcoin-xtc/pos-chain
          ref: ${{ steps.pin.outputs.commit }}
          path: pos-chain
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: pos-chain/evmd/go.mod
          cache-dependency-path: |
            pos-chain/go.sum
            pos-chain/evmd/go.sum
      # Schemas byte-identical to pos-chain and its pinned Cosmos SDK; vectors
      # byte-identical to what the chain's own Go code produces.
      - name: Check proto fixtures and chain-generated vectors
        run: bash scripts/check-chain-fixtures.sh pos-chain
