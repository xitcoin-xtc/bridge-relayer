name: Relayer

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: relayer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol and state tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Xitcoin chain integration tests need xitcoind built at the pinned
    # pos-chain commit; they are mandatory in CI.
    needs: chain-fixtures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # anvil and forge for the mandatory local-EVM Cronos submitter tests.
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.5
          cache: false
      - name: Verify every action and image is pinned
        run: bash scripts/verify-actions-pinned.sh
      - name: Restore xitcoind built at the pinned pos-chain commit
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: xitcoind-bin
          key: ${{ needs.chain-fixtures.outputs.xitcoind-key }}
          fail-on-cache-miss: true
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          XITCOIND_BIN: ${{ github.workspace }}/xitcoind-bin/xitcoind
      - run: npm run vectors
      # Dependency audit failure policy: retry the production audit up to three
      # times and preserve the final nonzero exit status. An unavailable
      # registry cannot establish that unchanged dependencies are still safe
      # (advisories appear without lockfile changes), so there is no success
      # fallback when the registry fails.
      - name: Audit production dependencies
        shell: bash
        run: |
          audit_output=""
          for attempt in 1 2 3; do
            set +e
            audit_output="$(npm audit --omit=dev --audit-level=high \
              --fetch-timeout=60000 \
              --fetch-retries=2 \
              --fetch-retry-mintimeout=1000 \
              --fetch-retry-maxtimeout=10000 2>&1)"
            audit_status=$?
            set -e
            printf '%s\n' "$audit_output"
            if [ "$audit_status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          exit "$audit_status"

  chain-fixtures:
    name: Chain fixtures and xitcoind at the pinned pos-chain commit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      xitcoind-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The single pin: test/fixtures/xitcoin-chain-vectors.json "posChainCommit".
      - name: Read the pinned pos-chain commit
        id: pin
        shell: bash
        run: |
          commit="$(sed -n 's/^  "posChainCommit": "\([0-9a-f]\{40\}\)",$/\1/p' test/fixtures/xitcoin-chain-vectors.json)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xitcoin-xtc/pos-chain
          ref: ${{ steps.pin.outputs.commit }}
          path: pos-chain
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        id: go
        with:
          go-version-file: pos-chain/evmd/go.mod
          cache-dependency-path: |
            pos-chain/go.sum
            pos-chain/evmd/go.sum
      # Schemas byte-identical to pos-chain and its pinned Cosmos SDK; vectors
      # byte-identical to what the chain's own Go code produces.
      - name: Check proto fixtures and chain-generated vectors
        run: bash scripts/check-chain-fixtures.sh pos-chain
      # The binary depends only on the pinned commit, the Go version and the
      # runner; it is rebuilt when any of them changes.
      - name: Compute the xitcoind cache key
        id: key
        env:
          COMMIT: ${{ steps.pin.outputs.commit }}
          GO_VERSION: ${{ steps.go.outputs.go-version }}
        run: echo "key=xitcoind-${RUNNER_OS}-${RUNNER_ARCH}-${COMMIT}-go${GO_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Restore xitcoind
        id: xitcoind
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: xitcoind-bin
          key: ${{ steps.key.outputs.key }}
      - name: Build xitcoind from the pinned commit
        if: steps.xitcoind.outputs.cache-hit != 'true'
        working-directory: pos-chain/evmd
        run: CGO_ENABLED=1 go build -tags netgo -trimpath -o "$GITHUB_WORKSPACE/xitcoind-bin/xitcoind" ./cmd/evmd
      - name: Check the xitcoind binary
        run: xitcoind-bin/xitcoind version
