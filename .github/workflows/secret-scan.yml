name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # A docker:// action runs as another user, so Git refuses the checkout
      # ("dubious ownership"), gitleaks reads no commit and still exits 0. Run
      # the pinned image as the checkout owner instead, and fail unless it
      # scanned at least one commit without any Git error.
      - name: Scan Git history for secrets
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 # v8.30.0
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/gitleaks.log"
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/repo:ro" --workdir /repo "$GITLEAKS_IMAGE" \
            git --redact --verbose --no-color --exit-code 1 . 2>&1 | tee "$log"
          if grep -Eq '(^| )(ERR|FTL) ' "$log"; then
            echo "gitleaks reported an error; the scan is not trustworthy" >&2
            exit 1
          fi
          grep -Eq '(^| )[1-9][0-9]* commits scanned' "$log" || { echo "gitleaks scanned no commit" >&2; exit 1; }
